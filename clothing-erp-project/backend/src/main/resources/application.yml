server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:clothing_erp;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: Y2xvdGhpbmctZXJwLWp3dC1zZWNyZXQta2V5LTIwMjQtc3ByaW5nYm9vdC1iYXNlNjQ=
  expiration: 86400000
