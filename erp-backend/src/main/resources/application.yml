server:
  port: 8080

spring:
  application:
    name: smartwms-api

  datasource:
    url: jdbc:h2:mem:smartwms;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

jwt:
  secret: SmartWMS-Secret-Key-2024-This-Is-A-Very-Long-Secret-Key-For-JWT-Signing
  expiration: 86400000

logging:
  level:
    com.smartwms: DEBUG
    org.hibernate.SQL: DEBUG
